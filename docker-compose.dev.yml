# Docker Compose override for ContractSim development
# Uses *-dev.banksim.ca domains and connects to BSIM dev environment
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Prerequisites:
#   - BSIM dev environment running (bsim_bsim-network exists)
#   - ContractSim database created in bsim-db PostgreSQL
#
# To create the database (run once):
#   docker exec bsim-db psql -U bsim -c "CREATE DATABASE contractsim;"

services:
  contractsim:
    container_name: contractsim-dev
    environment:
      NODE_ENV: development
      # Database - uses BSIM's PostgreSQL with separate database
      DATABASE_URL: postgresql://bsim:bsim_dev_password@bsim-db:5432/contractsim
      # Service API Keys (S2S auth - for incoming requests from WSIM/BSIM/TransferSim)
      WSIM_API_KEY: wsim-contractsim-dev-key-2026
      BSIM_API_KEY: bsim-contractsim-dev-key-2026
      TRANSFERSIM_API_KEY: transfersim-contractsim-dev-key-2026
      # Outbound API Keys (for ContractSim calling BSIM)
      BSIM_ESCROW_API_KEY: 99c33341e8817841833a6140027b83542f81e5d509b55d03d2fe7a2be212e72a
      # Webhook Secrets (HMAC verification - must match TransferSim's CONTRACTSIM_WEBHOOK_SECRET)
      TRANSFERSIM_WEBHOOK_SECRET: contractsim-transfersim-webhook-secret-dev-2026
      # External Service URLs (development)
      WSIM_URL: http://bsim-wsim-backend:3003
      BSIM_URL: http://bsim-backend:3001
      TRANSFERSIM_URL: http://bsim-transfersim:3010
      # Webhook URLs (for receiving callbacks)
      WEBHOOK_BASE_URL: http://contractsim-dev:3020
